name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  topology:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netdoc
          POSTGRES_PASSWORD: netdoc
          POSTGRES_DB: netdoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netdoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Пароль администратора, под которым тесты наполняют базу через API.
      E2E_ADMIN_PASSWORD: e2e-admin-password
      E2E_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Поднять бэкенд
        working-directory: backend
        env:
          DATABASE_URL: postgresql://netdoc:netdoc@localhost:5432/netdoc
          SECRET_KEY: ci-secret-key
          ENVIRONMENT: development
          CORS_ORIGINS: http://localhost:5173
          BOOTSTRAP_ADMIN_PASSWORD: e2e-admin-password
        run: |
          pip install -r requirements.txt
          python -m app.db_upgrade
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health || { cat uvicorn.log; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости фронтенда
        working-directory: frontend
        run: npm ci

      - name: Установить Chromium для Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Прогнать e2e
        working-directory: frontend
        run: npm run test:e2e

      - name: Сохранить артефакты упавших тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
            backend/uvicorn.log
          retention-days: 7

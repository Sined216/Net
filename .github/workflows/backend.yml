name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Тесты гоняются на настоящем PostgreSQL: модели используют типы,
        # которых нет в SQLite (ARRAY, а после задачи 0.4 — INET/MACADDR).
        image: postgres:16
        env:
          POSTGRES_USER: netdoc
          POSTGRES_PASSWORD: netdoc
          POSTGRES_DB: netdoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netdoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql://netdoc:netdoc@localhost:5432/netdoc_test
          SECRET_KEY: ci-secret-key
        run: pytest -q

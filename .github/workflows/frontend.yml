name: frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Типы фронтенда выводятся из описания API. Если его обновили, а
      # типы не перегенерировали, расхождение всплывёт здесь, а не в
      # работающем интерфейсе.
      - name: типы совпадают с описанием API
        run: |
          npm run codegen
          git diff --exit-code src/api/schema.ts

      - name: oxlint
        run: npm run lint

      - name: build (включает tsc -b)
        run: npm run build

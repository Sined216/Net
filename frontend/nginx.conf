server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка файлов при импорте спецификации может быть заметной.
    client_max_body_size 32m;

    # API проксируется на бэкенд под тем же origin, что и сам интерфейс:
    # поэтому браузеру не нужен CORS, а пользователю — вводить адрес API
    # на экране входа.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Хешированные ассеты Vite неизменяемы — их можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой маршрут (/devices, /topology...) отдаёт index.html,
    # дальше разбирается React Router. index.html не кешируем, иначе после
    # обновления пользователь получит старую сборку.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

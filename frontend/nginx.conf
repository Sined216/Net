server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка файлов при импорте спецификации может быть заметной.
    client_max_body_size 32m;

    # Заголовки безопасности — их не было ни одного. `always`, чтобы
    # добавлялись и на ответы с ошибкой (4xx/5xx), не только на 200.
    #
    # CSP собран под саму сборку: скрипты и стили только со своего же
    # источника (script-src без 'unsafe-inline'/'unsafe-eval' — это и есть
    # весь смысл CSP как защиты от XSS), style-src с 'unsafe-inline' —
    # Mantine и JointJS расставляют цвета и позиции инлайновым атрибутом
    # style, без этого разъехалась бы вся тема и схема сети. worker-src с
    # blob: — воркер укладки топологии (ELK) Vite оборачивает через blob-URL.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # API проксируется на бэкенд под тем же origin, что и сам интерфейс:
    # поэтому браузеру не нужен CORS, а пользователю — вводить адрес API
    # на экране входа.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Хешированные ассеты Vite неизменяемы — их можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой маршрут (/devices, /topology...) отдаёт index.html,
    # дальше разбирается React Router. index.html не кешируем, иначе после
    # обновления пользователь получит старую сборку.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

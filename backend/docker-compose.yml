services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: netdoc
      POSTGRES_PASSWORD: netdoc
      POSTGRES_DB: netdoc
    volumes:
      - netdoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netdoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://netdoc:netdoc@db:5432/netdoc
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@factory.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-please}
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"

volumes:
  netdoc_pgdata:

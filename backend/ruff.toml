# Строки в проекте местами длиннее 88 символов (сигнатуры хендлеров с
# зависимостями FastAPI), поэтому лимит поднят, а не отключён.
line-length = 120

[lint]
# Пока только настоящие ошибки. Сортировка импортов (I) и модернизация
# синтаксиса (UP) дадут диф по всему проекту — включаются в задаче 0.7 ТЗ
# вместе с заменой остальных устаревших API, отдельным коммитом.
select = ["E", "F", "W", "B"]
ignore = [
    # FastAPI-зависимости в аргументах по умолчанию — это идиома фреймворка,
    # а не ошибка (Depends(...) в сигнатуре хендлера).
    "B008",
]

[lint.per-file-ignores]
# В conftest импорты приложения намеренно идут после установки переменных
# окружения — иначе engine и SECRET_KEY читаются раньше времени.
"tests/conftest.py" = ["E402"]
